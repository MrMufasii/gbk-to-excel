name: Research - test the Aas fusion-shadow explanation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and patch shared analysis
        run: |
          mkdir -p scripts
          base64 -d research/aas_module_strengthening.py.gz.b64 | gzip -dc > scripts/aas_module_strengthening.py
          python research/patch_aas_analysis.py
          python -m py_compile scripts/aas_module_strengthening.py research/aas_fusion_shadow.py
      - name: Install profile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft hmmer
          pip install --disable-pip-version-check numpy==2.2.6 pandas==2.3.1 requests==2.32.4 biopython==1.85
      - name: Compare every N-terminal and C-terminal enzyme class on held-out Aas proteins
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python research/aas_fusion_shadow.py 2>&1 | tee aas_fusion_shadow.log
      - name: Preserve exact diagnostics
        if: always()
        run: |
          mkdir -p results/aas_fusion_shadow
          cp aas_fusion_shadow.log results/aas_fusion_shadow/run.log 2>/dev/null || true
          cp research/aas_fusion_shadow.py results/aas_fusion_shadow/executed_fusion_shadow.py
          cp scripts/aas_module_strengthening.py results/aas_fusion_shadow/executed_shared_analysis.py
          python --version > results/aas_fusion_shadow/environment.txt
          (hmmsearch -h 2>&1 | head -3 || true) >> results/aas_fusion_shadow/environment.txt
          pip freeze >> results/aas_fusion_shadow/environment.txt
          sha256sum research/aas_fusion_shadow.py scripts/aas_module_strengthening.py research/patch_aas_analysis.py >> results/aas_fusion_shadow/environment.txt
          find results/aas_fusion_shadow -type f -exec sha256sum {} + | sort > results/aas_fusion_shadow/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aas-fusion-shadow
          path: results/aas_fusion_shadow/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after preserving diagnostics
        if: steps.analysis.outcome == 'failure'
        run: exit 1
